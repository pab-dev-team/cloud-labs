user notcooky staff;
pid /tmp/lab1-nginx.pid;
error_log stderr;

events {}

http {
    access_log off;
    limit_req_zone $binary_remote_addr 
    zone=api_limit:10m rate=2r/s;

    upstream recipe_backends {
        server 127.0.0.1:5001;
        server 127.0.0.1:5002;
    }

    types {
        text/html html;
        text/css css;
        application/javascript js;
    }

    server {
    listen 80;
    return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate "/Users/notcooky/VSCode Projects/Cloud/lab1/certs/localhost.crt";
        ssl_certificate_key "/Users/notcooky/VSCode Projects/Cloud/lab1/certs/localhost.key";

        root "/Users/notcooky/VSCode Projects/Cloud/lab1/frontend";
        index index.html;

        location /static/ {
            alias "/Users/notcooky/VSCode Projects/Cloud/lab1/frontend/";
        }

        location /api/ {
            proxy_pass http://recipe_backends;
            proxy_set_header Host $host;
            limit_req zone=api_limit burst=2 nodelay;
            limit_req_status 429;
        }


        location /admin {
            auth_basic "Admin";
            auth_basic_user_file "/Users/notcooky/VSCode Projects/Cloud/lab1/.htpasswd";
            root "/Users/notcooky/VSCode Projects/Cloud/lab1";
            index index.html;
        }

        error_page 404 /404.html;
        location = /404.html {
            internal;
        }
    }

    server {
        listen 443 ssl;
        server_name other.test;

        ssl_certificate "/Users/notcooky/VSCode Projects/Cloud/lab1/certs/localhost.crt";
        ssl_certificate_key "/Users/notcooky/VSCode Projects/Cloud/lab1/certs/localhost.key";

        root "/Users/notcooky/VSCode Projects/Cloud/lab1/other-site";
        index index.html;
    }

    server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate "/Users/notcooky/VSCode Projects/Cloud/lab1/certs/localhost.crt";
    ssl_certificate_key "/Users/notcooky/VSCode Projects/Cloud/lab1/certs/localhost.key";

    return 404;
    }
}